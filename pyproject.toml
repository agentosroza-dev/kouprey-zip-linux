[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "kouprey-zip"
version = "1.3"
description = "A modern file archiver for Windows with WinUI 3-inspired design."
requires-python = ">=3.12"
authors = [{ name = "Agentos" }]
dependencies = [
    "PyQt6>=6.5",
    "PyQt6-sip>=13.5",
    "python-dotenv>=1.0",
    "py7zr>=0.20",
    "patool>=2.0",
    "rarfile>=4.0",
    "cryptography>=41.0",
]

[project.urls]
Homepage = "https://github.com/kouprey-zip"

[tool.setuptools.packages.find]
include = ["core*", "ui*", "tools*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.ico", "*.ttf", "*.png"]
